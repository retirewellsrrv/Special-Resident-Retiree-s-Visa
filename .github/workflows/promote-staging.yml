name: Promote to Staging
on:
    workflow_dispatch:

jobs:
    promote:
        runs-on: ubuntu-latest
        permissions:
            contents: write
            pull-requests: write
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Create promotion PR
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  gh pr create \
                    --base staging \
                    --head develop \
                    --title "Promote develop to staging" \
                    --body "Automated promotion — triggered manually via workflow_dispatch." \
                  || echo "PR already exists between develop and staging, skipping"
